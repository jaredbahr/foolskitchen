name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Godot checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Godot cache
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/
          key: ${{ runner.os }}-godot-${{ hashFiles('tools/godot_version.txt') }}

      - name: Download pinned Godot if needed
        run: bash tools/get_godot.sh

      - name: Import, parse and test
        run: |
          set +e
          set -uo pipefail
          ver="$(tr -d '[:space:]' < tools/godot_version.txt)"
          export GODOT=".tools/godot-$ver/Godot_v${ver}-stable_linux.x86_64"
          import_log="$(mktemp)"
          timeout --kill-after=2s 120s "$GODOT" --headless --path . --import >"$import_log" 2>&1
          import_status=$?
          cat "$import_log"
          overlap_status=1
          if [[ "$import_status" -eq 0 ]] && ! grep -Eq 'SCRIPT ERROR|Parse Error|^[[:space:]]*ERROR:' "$import_log"; then
            bash tools/repeat_game_session.sh --overlap
            overlap_status=$?
          else
            echo 'OVERLAP INCOMPLETE: strict headless import failed; no overlap samples ran.'
            echo 'OVERLAP SUMMARY: requested=10 attempted=0 passed=0 failed=0 incomplete=10'
          fi
          # A diagnostic failure must not prevent the ordinary full checks running.
          bash tools/check.sh
          checks_status=$?
          [[ "$import_status" -eq 0 && "$overlap_status" -eq 0 && "$checks_status" -eq 0 ]]

  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry
        run: bash tools/check_changelog.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
