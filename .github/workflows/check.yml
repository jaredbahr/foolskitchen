name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Godot checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Godot cache
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/
          key: ${{ runner.os }}-godot-${{ hashFiles('tools/godot_version.txt') }}

      - name: Download pinned Godot if needed
        run: bash tools/get_godot.sh

      - name: Import, parse and test
        run: |
          set -euo pipefail
          bash tools/check.sh
          version="$(tr -d '[:space:]' < tools/godot_version.txt)"
          godot=".tools/godot-$version/Godot_v${version}-stable_linux.x86_64"
          [[ -x "$godot" ]] || { echo 'FAIL: pinned Godot binary is missing after the checks'; exit 1; }
          probe_log="$(mktemp)"
          trap 'rm -f "$probe_log"' EXIT
          for seed in 1 7 42; do
            for price in 1.0 1.25; do
              printf '\n== balance probe: days=5 seed=%s price=%s\n' "$seed" "$price"
              "$godot" --headless --path . --script tools/balance_probe.gd -- --days=5 "--seed=$seed" "--price=$price" 2>&1 | tee "$probe_log"
              if grep -E 'SCRIPT ERROR|Parse Error|^[[:space:]]*ERROR:' "$probe_log"; then
                echo 'FAIL: engine/script errors during the balance probe'
                exit 1
              fi
              [[ "$(grep -c '^PROBE day=' "$probe_log")" -eq 5 ]] || { echo 'FAIL: probe did not report exactly five days'; exit 1; }
              for day in 1 2 3 4 5; do
                [[ "$(grep -c "^PROBE day=$day " "$probe_log")" -eq 1 ]] || { echo "FAIL: missing/duplicate probe day $day"; exit 1; }
              done
              [[ "$(grep -c '^PROBE total_profit=.* over 5 days$' "$probe_log")" -eq 1 ]] || { echo 'FAIL: missing/duplicate five-day probe summary'; exit 1; }
            done
          done

  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry
        run: bash tools/check_changelog.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
