name: Visual review captures

on:
  pull_request:
    paths:
      - '.github/workflows/visual-review.yml'
      - 'tools/screenshot.*'
      - 'src/world/**'
      - 'src/ui/**'
      - 'data/layouts/**'
      - 'project.godot'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Default, cutaway and inspection views
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '1'
      SCREENSHOT_TIMEOUT_SECONDS: '60'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check preinstalled capture prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screens/visual-review
          for command in xvfb-run Xvfb xauth timeout python3 dpkg-query; do
            command -v "$command" >/dev/null || { echo "BLOCKED: preinstalled command missing: $command"; exit 2; }
          done
          for package in xvfb libgl1-mesa-dri libglx-mesa0; do
            status="$(dpkg-query -W -f='${Status} ${Version}' "$package" 2>/dev/null)" || { echo "BLOCKED: preinstalled package missing: $package"; exit 2; }
            [[ "$status" == 'install ok installed '* ]] || { echo "BLOCKED: package is not installed: $package ($status)"; exit 2; }
            printf '%s %s\n' "$package" "$status" | tee -a screens/visual-review/capture-context.txt
          done
          printf 'checkout_commit=%s\nworkflow_sha=%s\nrunner_os=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" "$RUNNER_OS" >> screens/visual-review/capture-context.txt

      - name: Restore Godot cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/
          key: ${{ runner.os }}-godot-${{ hashFiles('tools/godot_version.txt') }}

      - name: Download official pinned Godot and import
        shell: bash
        run: |
          set -euo pipefail
          godot="$(bash tools/get_godot.sh)"
          printf 'GODOT=%s\n' "$godot" >> "$GITHUB_ENV"
          timeout 120 "$godot" --headless --path . --import 2>&1 | tee screens/visual-review/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^[[:space:]]*ERROR:' screens/visual-review/import.log; then
            echo 'FAIL: engine/script errors during capture import'
            exit 1
          fi

      - name: Capture actual default, cutaway and inspection views sequentially
        shell: bash
        run: |
          set -euo pipefail
          bash tools/screenshot.sh --out=screens/visual-review/default --frames=60 --speed=1
          for quarter in 0 1 2 3; do
            bash tools/screenshot.sh "--out=screens/visual-review/quarter-$quarter" --frames=60 --speed=1 "--quarter=$quarter"
          done
          bash tools/screenshot.sh --out=screens/visual-review/inspect-guest --open --fast=5 --select=guest --frames=60 --speed=1
          bash tools/screenshot.sh --out=screens/visual-review/debug-busy --open --fast=5 --select=guest --f3 --frames=60 --speed=1
          bash tools/screenshot.sh --out=screens/visual-review/mood-waits --open --fast=8 --frames=120,180,240,300 --speed=1
          bash tools/screenshot.sh --out=screens/visual-review/mood-pressure --open --fast=8 --mood-pressure --frames=120,140,160,180,200,220 --speed=1

      - name: Verify capture identity and image metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path
          import struct

          root = Path('screens/visual-review')
          captures = [('default', -1, False, False, 60)] + [(f'quarter-{q}', q, False, False, 60) for q in range(4)]
          captures += [('inspect-guest', -1, True, False, 60), ('debug-busy', -1, True, True, 60)]
          captures += [('mood-waits', -1, False, False, frame) for frame in (120, 180, 240, 300)]
          captures += [('mood-pressure', -1, False, False, frame) for frame in (120, 140, 160, 180, 200, 220)]
          observed_bands = {'mood-waits': set(), 'mood-pressure': set()}
          for name, requested, inspect_guest, debug, frame in captures:
              png = root / name / f'shot_{frame:04d}.png'
              raw = png.read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n' and len(raw) > 1000, f'{name}: missing/invalid PNG'
              assert struct.unpack('>II', raw[16:24]) == (1600, 900), f'{name}: wrong PNG dimensions'
              data = json.loads(png.with_suffix('.json').read_text())
              assert data['image_file'] == png.name, f'{name}: metadata names another image'
              assert data['image_sha256'] == hashlib.sha256(raw).hexdigest(), f'{name}: image/metadata digest mismatch'
              expected = 0 if requested == -1 else requested
              assert data['scene'] == 'res://src/world/main.tscn', f'{name}: wrong captured scene'
              assert data['capture_timing'] == 'frame_post_draw', f'{name}: pixels/state were not captured after draw'
              assert data['requested_quarter'] == requested, f'{name}: wrong requested quarter'
              assert data['actual_quarter'] == expected, f'{name}: wrong actual quarter'
              assert math.isclose(data['yaw_degrees'], 45 + 90 * expected, abs_tol=0.01), f'{name}: wrong rendered yaw'
              assert data['wall_mode'] == 1, f'{name}: not Cutaway'
              assert data['engine_errors'] == 0, f'{name}: engine/script errors'
              assert (data['width'], data['height'], data['frame']) == (1600, 900, frame), f'{name}: wrong viewport/frame'
              assert 'llvmpipe' in data['video_adapter'].lower(), f'{name}: not the requested software Mesa adapter'
              assert data['lowered_wall_cells'], f'{name}: no lowered walls'
              assert data['requested_selection'] == ('guest' if inspect_guest else ''), f'{name}: wrong requested selection'
              assert data['requested_debug_visible'] is debug, f'{name}: wrong requested F3 state'
              assert data['debug_visible'] is debug, f'{name}: wrong actual F3 state'
              assert data['panel_visible'] is inspect_guest, f'{name}: wrong actual inspect panel state'
              assert data['selected_item_id'] == -1, f'{name}: unexpected item selection'
              assert type(data['world_tick']) is int and data['world_tick'] >= 0, f'{name}: invalid world tick'
              if inspect_guest:
                  assert type(data['selected_agent_id']) is int and data['selected_agent_id'] > 0, f'{name}: no selected agent id'
                  assert data['selected_role'] == 'guest' and data['selected_agent_live'] is True, f'{name}: selected agent is not a live guest'
                  assert data['world_tick'] > 0, f'{name}: busy world did not advance'
              else:
                  assert data['selected_agent_id'] == -1 and data['selected_role'] == '', f'{name}: unexpected agent selection'
                  assert data['selected_agent_live'] is False, f'{name}: unexpected live selection'
              if name in ('mood-waits', 'mood-pressure'):
                  pressure_requested = name == 'mood-pressure'
                  fixture = 'cook_priorities_off' if pressure_requested else 'none'
                  assert data['capture_parameters'] == {'open': True, 'fast_ticks_per_frame': 8, 'speed': 1, 'mood_pressure': pressure_requested}, 'wrong mood capture parameters'
                  assert data['world_tick'] > 0, 'normal mood capture did not advance the simulation'
                  assert type(data['master_seed']) is str and data['master_seed'].lstrip('-').isdigit(), 'missing actual master seed'
                  assert set(data['restaurant_rng']) == {'seed', 'state'}, 'missing actual restaurant RNG snapshot'
                  assert all(type(value) is str and value.lstrip('-').isdigit() for value in data['restaurant_rng'].values()), 'invalid restaurant RNG snapshot'
                  mood = data['mood']
                  assert mood['available'] is True and mood['fixture'] == fixture and mood['requested_fixture'] == fixture, 'mood capture fixture was not disclosed accurately'
                  pressure = mood['pressure']
                  current_staff = {row['id']: row for row in pressure['current_staff']}
                  assert len(current_staff) == len(pressure['current_staff']), 'duplicate current staff ids'
                  assert all(type(staff_id) is int and staff_id > 0 for staff_id in current_staff), 'invalid live staff ids'
                  cooks = {staff_id for staff_id, row in current_staff.items() if row['role'] == 'cook'}
                  assert cooks and any(row['role'] == 'server' for row in current_staff.values()), 'missing actual cook or server'
                  assert all(type(row['priorities']) is dict and row['priorities'] and all(type(value) is int and value >= 0 for value in row['priorities'].values()) for row in current_staff.values()), 'invalid current public priorities'
                  if pressure_requested:
                      assert pressure['applied'] is True and pressure['phase_at_application'] == 0 and pressure['world_tick_at_application'] == 0, 'pressure was not applied before the fresh service opened'
                      applied = pressure['applied_staff_ids']
                      assert all(type(staff_id) is int and staff_id > 0 for staff_id in applied), 'invalid configured cook ids'
                      assert len(applied) == len(set(applied)) and set(applied) == cooks, 'configured ids do not match the actual live cooks'
                      configured_staff = {row['id']: row for row in pressure['staff']}
                      assert all(type(staff_id) is int and staff_id > 0 for staff_id in configured_staff), 'invalid configured staff ids'
                      assert len(configured_staff) == len(pressure['staff']) and set(configured_staff) == set(current_staff), 'configured staff snapshot differs from current actual staff'
                      for staff_id, row in configured_staff.items():
                          current = current_staff[staff_id]
                          assert row['live'] is True and row['role'] == row['current_role'] == current['role'], 'configured staff is gone or changed role'
                          assert row['current'] == current['priorities'] and set(row['before']) == set(row['after']) == set(row['current']), 'priority snapshot keys or current values differ'
                          if staff_id in cooks:
                              assert row['configured'] is True and any(value > 0 for value in row['before'].values()), 'cook was not active before pressure setup'
                              assert all(value == 0 for value in row['after'].values()) and row['current'] == row['after'], 'actual cook priorities are not all off'
                          else:
                              assert row['configured'] is False and row['before'] == row['after'] == row['current'], 'pressure setup changed the server or other staff'
                      print(f'{name} frame={frame}: applied cook ids={sorted(applied)}, actual current priorities={current_staff}')
                  else:
                      assert pressure['applied'] is False and not pressure['applied_staff_ids'] and not pressure['staff'], 'normal capture applied a pressure fixture'
                      assert pressure['phase_at_application'] is None and pressure['world_tick_at_application'] is None, 'normal capture contains pressure setup history'
                      assert all(row['priorities'] == {'any': 1, row['role']: 2} for row in current_staff.values()), 'normal capture changed the default staff priorities'
                  waiting = mood['waiting_guests']
                  visible = mood['visible_indicators']
                  guests = {row['id']: row for row in waiting}
                  icons = {row['id']: row for row in visible}
                  assert len(guests) == len(waiting) and len(icons) == len(visible), 'duplicate mood evidence ids'
                  assert set(guests) == set(icons), 'visible indicator ids do not match actual waiting guests'
                  colors = ((56, 118, 75), (201, 163, 70), (200, 116, 58), (168, 62, 53))
                  for guest_id, guest in guests.items():
                      assert type(guest_id) is int and guest_id > 0 and type(guest['state']) is int and guest['state'] in (1, 3, 4), 'invalid waiting guest'
                      assert all(type(guest[key]) is int for key in ('queue_wait', 'queue_patience', 'food_wait', 'food_patience')), 'invalid patience snapshot'
                      elapsed, budget = (guest['queue_wait'], guest['queue_patience']) if guest['state'] == 1 else (guest['food_wait'], guest['food_patience'])
                      expected_mood = 0.0 if budget <= 0 else (budget - min(max(elapsed, 0), budget)) / budget
                      assert math.isfinite(guest['mood']) and math.isclose(guest['mood'], expected_mood, rel_tol=0, abs_tol=1e-12), 'mood does not match actual patience'
                      band = 0 if expected_mood >= .6 else 1 if expected_mood >= .35 else 2 if expected_mood >= .15 else 3
                      icon = icons[guest_id]
                      assert type(icon['parent_agent_id']) is int and icon['parent_agent_id'] == guest_id, 'indicator is attached to another agent'
                      assert type(guest['band']) is int and type(icon['band']) is int and guest['band'] == icon['band'] == band, 'displayed band differs from waiting guest'
                      assert icon['visible_in_tree'] is True and icon['dot_visible'] is True, 'indicator is hidden'
                      assert icon['mark'] == ('', '', '!', '!!')[band] and icon['mark_visible'] is (band >= 2), 'wrong visible mood punctuation'
                      assert len(icon['color']) == 4 and all(math.isclose(actual, expected / 255, rel_tol=0, abs_tol=1e-7) for actual, expected in zip(icon['color'], (*colors[band], 255))), 'wrong native dot color'
                      assert icon['in_camera_frustum'] is True, 'waiting indicator is outside the captured camera'
                      assert len(icon['screen_position']) == 2 and 0 <= icon['screen_position'][0] < data['width'] and 0 <= icon['screen_position'][1] < data['height'], 'indicator center is outside the image'
                      assert all(type(guest[key]) is str and guest[key].lstrip('-').isdigit() for key in ('rng_seed', 'rng_state')), 'missing actual guest RNG snapshot'
                      observed_bands[name].add(band)
                  print(f'{name} frame={frame}: observed bands={sorted({row["band"] for row in visible})}, waiting ids={sorted(guests)}, seed={data["master_seed"]}, fixture={fixture}')
              print(f'{name}: actual quarter={expected}, Cutaway, guest={data["selected_agent_id"]}, F3={debug}, tick={data["world_tick"]}, 1600x900, sha256={hashlib.sha256(raw).hexdigest()}')
          for name, bands in observed_bands.items():
              print(f'{name} observed bands across frames: {sorted(bands)}; multiple-band and urgent-legibility screenshot acceptance still requires image review.')
          PY

      - name: Upload actual captures, metadata and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: screens/visual-review/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
