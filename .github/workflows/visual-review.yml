name: Visual review captures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-review.yml'
      - 'tools/verify_visual_review.py'
  pull_request:
    paths:
      - 'tools/verify_visual_review.py'
      - '.github/workflows/visual-review.yml'
      - 'tools/screenshot.*'
      - 'tools/menu_boards_review.gd'
      - 'tools/records_review.*'
      - 'tools/jukebox_review.gd'
      - 'tools/order_counter_review.gd'
      - 'tools/aquarium_review.gd'
      - 'tools/daily_special_review.gd'
      - 'tools/daily_special_review.tscn'
      - 'tools/property_review.gd'
      - 'tools/site_card_review.gd'
      - 'src/world/**'
      - 'src/ui/**'
      - 'data/layouts/**'
      - 'project.godot'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Visual captures (${{ matrix.batch }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        batch: [shop, service]
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '1'
      SCREENSHOT_TIMEOUT_SECONDS: '60'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check preinstalled capture prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screens/visual-review
          printf 'batch=%s\n' '${{ matrix.batch }}' > screens/visual-review/capture-context.txt
          for command in xvfb-run Xvfb xauth timeout python3 dpkg-query; do
            command -v "$command" >/dev/null || { echo "BLOCKED: preinstalled command missing: $command"; exit 2; }
          done
          for package in xvfb libgl1-mesa-dri libglx-mesa0; do
            status="$(dpkg-query -W -f='${Status} ${Version}' "$package" 2>/dev/null)" || { echo "BLOCKED: preinstalled package missing: $package"; exit 2; }
            [[ "$status" == 'install ok installed '* ]] || { echo "BLOCKED: package is not installed: $package ($status)"; exit 2; }
            printf '%s %s\n' "$package" "$status" | tee -a screens/visual-review/capture-context.txt
          done
          printf 'checkout_commit=%s\nworkflow_sha=%s\nrunner_os=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" "$RUNNER_OS" >> screens/visual-review/capture-context.txt
          printf 'daily_special_review_gd_sha256=%s\n' "$(sha256sum tools/daily_special_review.gd | cut -d' ' -f1)" >> screens/visual-review/capture-context.txt
          printf 'daily_special_review_tscn_sha256=%s\n' "$(sha256sum tools/daily_special_review.tscn | cut -d' ' -f1)" >> screens/visual-review/capture-context.txt

      - name: Restore Godot cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/
          key: ${{ runner.os }}-godot-${{ hashFiles('tools/godot_version.txt') }}

      - name: Download official pinned Godot and import
        shell: bash
        run: |
          set -euo pipefail
          godot="$(bash tools/get_godot.sh)"
          printf 'GODOT=%s\n' "$godot" >> "$GITHUB_ENV"
          timeout 120 "$godot" --headless --path . --import 2>&1 | tee screens/visual-review/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^[[:space:]]*ERROR:' screens/visual-review/import.log; then
            echo 'FAIL: engine/script errors during capture import'
            exit 1
          fi

      - if: matrix.batch == 'shop'
        name: Capture shop and inspection views
        shell: bash
        run: |
          set -euo pipefail
          bash tools/screenshot.sh --out=screens/visual-review/default --frames=60 --speed=1
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/movement-passing --scene=res://tools/movement_review.tscn --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/street-front --street-front-review --speed=0 --frames=60
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/curb-appeal --scene=res://tools/curb_appeal_review.tscn --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/a-frame-sign --scene=res://tools/a_frame_review.tscn --speed=0 --frames=60
          for quarter in 0 1 2 3; do
            bash tools/screenshot.sh "--out=screens/visual-review/quarter-$quarter" --frames=60 --speed=1 "--quarter=$quarter"
          done
          bash tools/screenshot.sh --out=screens/visual-review/neighbourhood-street --neighbourhood-review=street --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/inspect-guest --open --fast=5 --select=guest --frames=60 --speed=1
          bash tools/screenshot.sh --out=screens/visual-review/debug-busy --open --fast=5 --select=guest --f3 --frames=60 --speed=1
          bash tools/screenshot.sh --out=screens/visual-review/owner-kitchen --open --fast=5 --select=owner --assign-owner=kitchen --frames=60 --speed=1
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/mood-waits --open --fast=8 --frames=120,180,240,300 --speed=1
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/people-poses --open --fast=8 --frames=60,240 --speed=1
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/door-queue --door-queue --open --fast=8 --frames=240 --speed=1
          bash tools/screenshot.sh --out=screens/visual-review/waiting-bench --scene=res://tools/waiting_bench_review.tscn --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/thin-divider --scene=res://tools/divider_review.tscn --speed=0 --frames=30
          DIVIDER_REVIEW_STAGE=remove bash tools/screenshot.sh --out=screens/visual-review/divider-remove-restroom --scene=res://tools/divider_review.tscn --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/loan-review --loan-review --speed=0 --frames=12,90
          bash tools/screenshot.sh --out=screens/visual-review/milestone-review --milestone-review --speed=0 --frames=12,90
          bash tools/screenshot.sh --out=screens/visual-review/records --scene=res://tools/records_review.tscn --speed=0 --frames=30,90
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/collections --collections-review --speed=0 --frames=240
          bash tools/screenshot.sh --out=screens/visual-review/catalogue-rustic --catalogue-review=rustic --speed=0 --frames=90,120
          bash tools/screenshot.sh --out=screens/visual-review/catalogue-modern --catalogue-review=modern --speed=0 --frames=90,120
          bash tools/screenshot.sh --out=screens/visual-review/joined-tables --joined-tables-review --speed=0 --frames=12,90
          bash tools/screenshot.sh --out=screens/visual-review/diner-review --diner-review --speed=0 --frames=12,90
          bash tools/screenshot.sh --out=screens/visual-review/menu --menu --lease-review=offer --speed=0 --frames=12
          bash tools/screenshot.sh --out=screens/visual-review/season-stock --stock --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/lease-short --menu --lease-review=short --speed=0 --frames=12
          bash tools/screenshot.sh --out=screens/visual-review/lease-expand --lease-review=expand --speed=0 --frames=12
          bash tools/screenshot.sh --out=screens/visual-review/staff --staff --speed=0 --frames=12
          bash tools/screenshot.sh --out=screens/visual-review/property --property-review --speed=0 --frames=12
          bash tools/screenshot.sh --out=screens/visual-review/site-card --site-card-review --speed=0 --frames=12,30
          bash tools/screenshot.sh --out=screens/visual-review/haggle --scene=res://tools/haggle_review.tscn --speed=0 --frames=30,90
          bash tools/screenshot.sh --out=screens/visual-review/first-day-guide --scene=res://tools/hints_review.tscn --speed=0 --frames=30
          bash tools/screenshot.sh --scene=res://tools/food_review.tscn --out=screens/visual-review/food-service --speed=0 --frames=12,90
          bash tools/screenshot.sh --out=screens/visual-review/icons-review --scene=res://tools/icons_review.tscn --speed=0 --frames=12,60
          bash tools/screenshot.sh --out=screens/visual-review/restaurant-cat --scene=res://tools/cat_review.tscn --speed=0 --frames=30,70,110
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/aquarium --scene=res://tools/aquarium_review.tscn --speed=0 --frames=30,60,90
          bash tools/screenshot.sh --out=screens/visual-review/health-inspector --scene=res://tools/inspector_review.tscn --speed=0 --frames=30,70,110
          OWNER_REVIEW_STAGE=picker bash tools/screenshot.sh --out=screens/visual-review/owner-picker --scene=res://tools/owner_character_review.tscn --speed=0 --frames=60
          OWNER_REVIEW_STAGE=shop bash tools/screenshot.sh --out=screens/visual-review/owner-character --scene=res://tools/owner_character_review.tscn --speed=0 --frames=60

      - if: matrix.batch == 'service'
        name: Capture order-counter, service and interface views
        shell: bash
        run: |
          set -euo pipefail
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/order-counter --scene=res://tools/order_counter_review.tscn --speed=0 --frames=90,330
          bash tools/screenshot.sh --out=screens/visual-review/report --report --open --fast=100 --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/blueprint-codes --blueprints=ghost --speed=0 --frames=30
          bash tools/screenshot.sh --out=screens/visual-review/report-slowest --report-slowest --open --fast=100 --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/daily-special --scene=res://tools/daily_special_review.tscn --speed=0 --frames=30,120
          bash tools/screenshot.sh --out=screens/visual-review/profit-review --scene=res://tools/profit_review.tscn --report --open --fast=1 --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/demand-report --scene=res://tools/demand_report_review.tscn --speed=0 --frames=60
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/staff-activity-report --scene=res://tools/staff_activity_review.tscn --speed=0 --frames=60
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/business-trend --scene=res://tools/business_trend_review.tscn --speed=0 --frames=60
          SCREENSHOT_TIMEOUT_SECONDS=120 bash tools/screenshot.sh --out=screens/visual-review/business-trend-30 --scene=res://tools/business_trend_review.tscn --speed=0 --frames=60 --trend-days=30
          bash tools/screenshot.sh --out=screens/visual-review/regulars-review --scene=res://tools/regulars_review.tscn --frames=12,90 --speed=0
          bash tools/screenshot.sh --out=screens/visual-review/food-critic --scene=res://tools/critic_review.tscn --frames=12,90 --speed=0
          bash tools/screenshot.sh --out=screens/visual-review/rush-hour --scene=res://tools/rush_hour_review.tscn --frames=12,90 --speed=0
          bash tools/screenshot.sh --out=screens/visual-review/service-event --scene=res://tools/service_event_review.tscn --frames=60 --speed=0
          bash tools/screenshot.sh --out=screens/visual-review/paint --paint --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/floors-review --floors-review --speed=0 --frames=12,30
          SEAFOOD_REVIEW_STAGE=floor bash tools/screenshot.sh --out=screens/visual-review/seafood-floor --scene=res://tools/seafood_review.tscn --speed=0 --frames=30
          SEAFOOD_REVIEW_STAGE=menu bash tools/screenshot.sh --out=screens/visual-review/seafood-menu --scene=res://tools/seafood_review.tscn --speed=0 --frames=30
          bash tools/screenshot.sh --out=screens/visual-review/walls-review --walls-review --speed=0 --frames=12,30
          bash tools/screenshot.sh --out=screens/visual-review/weather-sunny --weather-review=sunny --menu --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/weather-rain --weather-review=rain --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/patio-sunny --scene=res://tools/patio_review_sunny.tscn --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/patio-rain --scene=res://tools/patio_review_rain.tscn --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/restroom-review --restroom-review --speed=0 --frames=12,30
          bash tools/screenshot.sh --out=screens/visual-review/hygiene-review --scene=res://tools/hygiene_review.tscn --speed=0 --frames=12,60 --quarter=2
          bash tools/screenshot.sh --out=screens/visual-review/cutaway-review --scene=res://tools/cutaway_review.tscn --speed=0 --frames=30 --quarter=2
          DAY_NIGHT_STAGE=golden bash tools/screenshot.sh --out=screens/visual-review/day-night-golden --scene=res://tools/day_night_review.tscn --speed=0 --frames=30
          DAY_NIGHT_STAGE=closed bash tools/screenshot.sh --out=screens/visual-review/day-night-closed --scene=res://tools/day_night_review.tscn --speed=0 --frames=30
          LAMPS_STAGE=night LAMPS_WALLS=up bash tools/screenshot.sh --out=screens/visual-review/lamps-night --scene=res://tools/lamps_review.tscn --speed=0 --frames=30
          OPENINGS_REVIEW_STAGE=before bash tools/screenshot.sh --out=screens/visual-review/openings-before --scene=res://tools/openings_review.tscn --speed=0 --frames=30 --quarter=2
          OPENINGS_REVIEW_STAGE=after bash tools/screenshot.sh --out=screens/visual-review/openings-after --scene=res://tools/openings_review.tscn --speed=0 --frames=30 --quarter=2
          bash tools/screenshot.sh --out=screens/visual-review/menu-boards-review --menu-boards-review --speed=0 --frames=12,30
          bash tools/screenshot.sh --out=screens/visual-review/signature-menu --signature-review=menu --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/signature-demand --signature-review=demand --speed=0 --frames=60
          bash tools/screenshot.sh --out=screens/visual-review/jukebox --scene=res://tools/jukebox_review.tscn --speed=0 --frames=12,40
          bash tools/screenshot.sh --out=screens/visual-review/build-green --build=green --quarter=0 --frames=12 --speed=1
          bash tools/screenshot.sh --out=screens/visual-review/build-red --build=red --quarter=0 --frames=12 --speed=1
          bash tools/screenshot.sh --out=screens/visual-review/build-pinch --build=pinch --quarter=2 --frames=12 --speed=1
          bash tools/screenshot.sh --out=screens/visual-review/viral --scene=res://tools/viral_review.tscn --speed=0 --frames=30,90
          bash tools/screenshot.sh --out=screens/visual-review/menu-access-preview --scene=res://tools/menu_access_review.tscn --speed=0 --frames=12
          bash tools/screenshot.sh --out=screens/visual-review/blueprint-looks --scene=res://tools/blueprint_looks_review.tscn --speed=0 --frames=12,60
          FK_MENU_REVIEW_STAGE=open bash tools/screenshot.sh --out=screens/visual-review/menu-access-open --scene=res://tools/menu_access_review.tscn --speed=0 --frames=12
          bash tools/screenshot.sh --out=screens/visual-review/settings --settings --speed=0 --frames=12
          bash tools/screenshot.sh --out=screens/visual-review/shortcuts --shortcuts --speed=0 --frames=12
          bash tools/screenshot.sh --out=screens/visual-review/settings-world --settings-world --speed=0 --frames=90
          bash tools/screenshot.sh --out=screens/visual-review/hud-1280 --hud-layout --window-size=1280x720 --speed=0 --frames=12,90
          bash tools/screenshot.sh --out=screens/visual-review/hud-1600 --hud-layout --window-size=1600x900 --speed=0 --frames=12,90
          MESS_REVIEW_FLOOR=dark bash tools/screenshot.sh --out=screens/visual-review/messes-dark --scene=res://tools/messes_review.tscn --speed=0 --frames=60
          MESS_REVIEW_FLOOR=light bash tools/screenshot.sh --out=screens/visual-review/messes-light --scene=res://tools/messes_review.tscn --speed=0 --frames=60
          timeout 60 xvfb-run -a -s '-screen 0 1600x900x24' "$GODOT" --path . --rendering-method gl_compatibility --audio-driver Dummy --script tools/title_review.gd -- --out=screens/visual-review/title

      - if: matrix.batch == 'service'
        name: Capture seated guests at a real table
        shell: bash
        run: |
          set -euo pipefail
          capture_data=$(mktemp -d)
          trap 'rm -rf -- "$capture_data"' EXIT
          export XDG_DATA_HOME="$capture_data"
          timeout 120 xvfb-run -a -s '-screen 0 1600x900x24' "$GODOT" --path . --rendering-method gl_compatibility --audio-driver Dummy --script tools/seated_table_review.gd -- --capture-only --out=screens/visual-review/seated-tables 2>&1 | tee screens/visual-review/seated-tables.log
          if grep -E 'SCRIPT ERROR|Parse Error|^[[:space:]]*ERROR:' screens/visual-review/seated-tables.log; then
            exit 1
          fi

      - if: matrix.batch == 'service'
        name: Capture the advisory restock warning
        shell: bash
        run: |
          set -euo pipefail
          capture_data=$(mktemp -d)
          trap 'rm -rf -- "$capture_data"' EXIT
          export XDG_DATA_HOME="$capture_data"
          timeout 60 xvfb-run -a -s '-screen 0 1600x900x24' "$GODOT" --path . --rendering-method gl_compatibility --audio-driver Dummy --script tools/restock_warning_shot.gd -- --out=screens/visual-review/restock-warning 2>&1 | tee screens/visual-review/restock-warning.log
          if grep -E 'SCRIPT ERROR|Parse Error|^[[:space:]]*ERROR:' screens/visual-review/restock-warning.log; then
            exit 1
          fi

      - name: Verify capture identity and image metadata
        shell: bash
        env:
          VISUAL_REVIEW_BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          python3 tools/verify_visual_review.py "$VISUAL_REVIEW_BATCH"
          if [[ "$VISUAL_REVIEW_BATCH" == shop ]]; then
            timeout 60 "$GODOT" --headless --path . --script tools/diner_capture_validator.gd
          fi

      - name: Upload actual captures, metadata and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-review-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}-${{ matrix.batch }}
          path: screens/visual-review/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  visual-review:
    name: Default, cutaway and inspection views
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: capture
    if: ${{ always() }}
    steps:
      - name: Require both visual capture jobs
        shell: bash
        env:
          CAPTURE_RESULT: ${{ needs.capture.result }}
        run: test "$CAPTURE_RESULT" = success
